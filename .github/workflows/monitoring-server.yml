name: Monitoring server
on:
  push:
    paths: ['monitoring-server/**', '.github/workflows/monitoring-server.yml']
  pull_request:
    paths: ['monitoring-server/**', '.github/workflows/monitoring-server.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitoring-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: monitoring-server/pom.xml
      - run: mvn -B -ntp verify
