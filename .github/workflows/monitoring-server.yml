name: Monitoring server
on:
  push:
    paths: ['monitoring-server/**', '.github/workflows/monitoring-server.yml']
  pull_request:
    paths: ['monitoring-server/**', '.github/workflows/monitoring-server.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: monitoring-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: monitoring-server/pom.xml
      - if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja git
      - if: runner.os == 'Windows'
        shell: pwsh
        run: '"C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append'
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc
      - run: mvn -B -ntp -Pnative-codec verify
      - run: java -jar target/monitoring-server-0.1.0.jar --codec-self-test
      - run: node --test src/test/js/*.test.js
      - run: node --check src/main/resources/static/portal.js
      - run: node --check src/main/resources/static/web-voice.js
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-server-${{ runner.os }}-x64
          path: monitoring-server/target/monitoring-server-0.1.0.jar
