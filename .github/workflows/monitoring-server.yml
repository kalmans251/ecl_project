name: Monitoring server
on:
  push:
    paths: ['monitoring-server/**', '.github/workflows/monitoring-server.yml']
  pull_request:
    paths: ['monitoring-server/**', '.github/workflows/monitoring-server.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitoring-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: monitoring-server/pom.xml
      - run: mvn -B -ntp verify
      - run: |
          node --check src/main/resources/static/portal.js
          node --check src/main/resources/static/mic-worklet.js
          node --check src/main/resources/static/login.js
      - run: sudo apt-get update && sudo apt-get install -y libcodec2-dev
      - run: python3 -m unittest discover -s tools -p 'test_codec_adapter.py'
