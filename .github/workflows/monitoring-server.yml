name: Monitoring server
on:
  push:
    paths: ['monitoring-server/**', '.github/workflows/monitoring-server.yml']
  pull_request:
    paths: ['monitoring-server/**', '.github/workflows/monitoring-server.yml']
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: monitoring-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: monitoring-server/pom.xml
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build gcc
      - if: runner.os == 'Linux'
        run: mvn -B -ntp -Pnative-codec verify
      - run: mvn -B -ntp verify
      - if: runner.os == 'Windows'
        run: mvn -B -ntp -Pwindows-codec-auto verify
      - if: runner.os == 'Windows'
        shell: powershell
        run: |
          # Exercise the unchanged user command lifecycle and cached preparation on PS 5.1.
          mvn -B -ntp spring-boot:run "-Dspring-boot.run.arguments=--codec-self-test"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path target/classes/win32-x86-64/codec2.dll)) { throw 'Missing native resource' }
      - if: runner.os == 'Linux'
        run: java -jar target/monitoring-server-0.1.0.jar --codec-self-test
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Prove the deployment JAR does not need the build toolchain's DLLs.
          $env:PATH = ($env:PATH.Split(';') | Where-Object { $_ -notmatch '(?i)msys|mingw' }) -join ';'
          java -jar target/monitoring-server-0.1.0.jar --codec-self-test
      - if: runner.os == 'Windows'
        shell: powershell
        run: ./tools/test-codec-windows.ps1
      - run: node --test src/test/js/*.test.js
      - run: node --check src/main/resources/static/portal.js
      - run: node --check src/main/resources/static/web-voice.js
      - uses: actions/upload-artifact@v4
        with:
          name: monitoring-server-${{ runner.os }}-x64
          path: monitoring-server/target/monitoring-server-0.1.0.jar
