# Complete Windows example for omtest.duckdns.org.
# Copy OUTSIDE the repository to C:/nginx/conf/nginx.conf after backing up.
# Requires the Spring Boot CCTV endpoints and authenticated MediaMTX configuration.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 443 ssl;
        server_name omtest.duckdns.org;

        ssl_certificate "C:/nginx/conf/ssl/omtest.duckdns.org-chain.pem";
        ssl_certificate_key "C:/nginx/conf/ssl/omtest.duckdns.org-key.pem";
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout 5m;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Portal and REST API.
        location / {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Existing STOMP, CCTV control, railing and voice connections.
        location /ws-stomp {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        location /ws/cameras/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
            proxy_send_timeout 10s;
            proxy_buffering off;
        }

        location /ws/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            proxy_buffering off;
        }

        # Authentication callback is only called directly over server loopback.
        location = /api/cctv/media-auth {
            return 404;
        }
        location ^~ /api/cctv/media-auth/ {
            return 404;
        }

        # Retire the legacy direct video endpoint.
        location = /cctv {
            return 404;
        }
        location ^~ /cctv/ {
            return 404;
        }

        # WebRTC SDP/session requests. Media itself uses UDP 8189.
        location /cctv-media/ {
            proxy_pass http://127.0.0.1:8889/;
            proxy_http_version 1.1;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect ~^/(.*)$ /cctv-media/$1;
            client_max_body_size 64k;
            proxy_buffering off;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
        }
    }

    server {
        listen 80;
        server_name omtest.duckdns.org;

        # Preserve win-acme filesystem certificate renewal.
        location ^~ /.well-known/acme-challenge/ {
            root C:/nginx/html;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://omtest.duckdns.org$request_uri;
        }
    }
}
