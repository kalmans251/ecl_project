# Merge these locations INSIDE the existing HTTPS server block.
# Replace old /cctv/ proxy; retain the existing ACME HTTP location and certificate.
# This file is a fragment, not a full nginx.conf.
location /ws/cameras/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
    proxy_send_timeout 10s;
}
# Only local MediaMTX can call the backend directly. Never proxy this callback.
location = /api/cctv/media-auth { return 404; }
# Remove the old unauthenticated video proxy.
location /cctv/ { return 404; }
location /cctv-media/ {
    proxy_pass http://127.0.0.1:8889/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_redirect ~^/(.*)$ /cctv-media/$1;
    proxy_buffering off;
    client_max_body_size 64k;
    proxy_read_timeout 15s;
}
