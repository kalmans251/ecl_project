server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  tomcat:
    max-connections: 100
spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/monitoring}
    username: sa
    password: ${DATABASE_PASSWORD:}
  sql:
    init:
      mode: always
monitoring:
  admin-token: ${MONITOR_ADMIN_TOKEN:}
  analytics-token: ${MONITOR_ANALYTICS_TOKEN:}
  gateways:
    - id: gateway-01
      token: ${MONITOR_GATEWAY_TOKEN:}
  cameras:
    - id: cctv01
      gateway-id: gateway-01
      railing-id: 1

portal:
  bootstrap-user: ${MONITOR_BOOTSTRAP_USER:admin}
  bootstrap-password: ${MONITOR_BOOTSTRAP_PASSWORD:}
  sms-key: ${SMS_API_KEY:}
  sms-secret: ${SMS_API_SECRET:}
  sms-from: ${SMS_FROM:}
  codec-url: ${CODEC_URL:http://127.0.0.1:9200}
  codec-token: ${CODEC_TOKEN:}
