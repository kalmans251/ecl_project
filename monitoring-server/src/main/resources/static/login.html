<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eco Luminous 로그인</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#070a12;color:#dce9f5;font-family:system-ui}main{padding:36px;width:min(360px,80vw);background:#121929;border:1px solid #28516c;border-radius:16px}h1{color:#00f2fe;font-size:24px}label{display:block;margin:18px 0 8px}input,button{box-sizing:border-box;width:100%;padding:12px;border-radius:7px;border:1px solid #34566b;background:#192d40;color:#fff}button{margin-top:22px;background:#0c6271;cursor:pointer}p{font-size:13px;color:#a9bdce}#error{color:#ffb300}</style><main><h1>Eco Luminous System</h1><p>모니터링 계정으로 로그인하세요.</p><form id="loginForm"><label for="username">계정</label><input id="username" name="username" autocomplete="username" required maxlength="100"><label for="password">비밀번호</label><input id="password" name="password" type="password" autocomplete="current-password" required><button>로그인</button></form><p id="error" role="alert"></p><p>새 계정은 현장 관리자가 등록합니다.</p></main><script src="/login.js"></script></html>
