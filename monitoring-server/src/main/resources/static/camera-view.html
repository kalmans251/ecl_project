<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>CCTV</title>
<style>body{margin:0;background:#fff;color:#222;font:14px sans-serif}#stage{position:relative;background:#111}video{display:block;width:100%;height:75vh;object-fit:contain}canvas{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}#stage:fullscreen video{height:100vh}p,label,button{margin:8px}button{background:white;border:1px solid #ccc;padding:8px}</style>
<div id="stage"><video id="video" autoplay muted playsinline controls controlslist="nofullscreen" disablepictureinpicture></video><canvas id="overlay" aria-label="사람 인식 박스 및 추정 나이"></canvas></div>
<label><input id="show-overlay" type="checkbox" checked>사람·추정 나이 표시</label><button id="fullscreen">전체 화면</button>
<p id="overlay-status">분석 결과 대기</p><p id="status">카메라 연결 중</p>
<script src="/camera-overlay.js"></script><script src="/camera-view.js"></script></html>
